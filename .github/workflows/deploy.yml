name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, prod]
    timeout-minutes: 15
    steps:
      - name: Run deploy script
        run: /var/www/inio_database_web/deploy.sh
